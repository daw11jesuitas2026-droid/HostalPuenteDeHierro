<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resumen de reserva | Hostal Puente de Hierro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-md site-header sticky-top" aria-label="Principal">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="img/logo-icono.jpg" alt="Logotipo del Hostal Puente de Hierro" width="40" height="40" class="rounded flex-shrink-0">
        Hostal Puente de Hierro
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
              aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir o cerrar el menú"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-md-auto align-items-md-center">
          <li class="nav-item"><a class="nav-link" href="index.html"><span>Inicio</span><span class="flecha" aria-hidden="true">→</span></a></li>
          <li class="nav-item"><a class="nav-link active" href="habitaciones.html" aria-current="page"><span>Habitaciones</span><span class="flecha" aria-hidden="true">→</span></a></li>
          <li class="nav-item"><a class="nav-link" href="sobre-nosotros.html"><span>Sobre nosotros</span><span class="flecha" aria-hidden="true">→</span></a></li>
          <li class="nav-item nav-cta"><a class="btn btn-brand w-100" href="habitaciones.html">Reservar</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <h1 class="page-title">Resumen de tu reserva</h1>

        <div class="summary-card mb-3">
          <div class="rating">★ 4.60</div>
          <h3>Habitación Deluxe cama extragrande</h3>
          <div class="room-meta mb-0">2 huéspedes · 1 dormitorio · 1 baño</div>
        </div>

        <form action="reserva-confirmada.html" method="get">
          <div class="row g-2">
            <div class="col-6"><div class="form-floating"><input type="date" class="form-control" id="llegada" name="llegada" value="2026-11-27" placeholder=" " required><label for="llegada">Llegada</label></div></div>
            <div class="col-6"><div class="form-floating"><input type="date" class="form-control" id="salida" name="salida" value="2026-11-29" placeholder=" " required><label for="salida">Salida</label></div></div>
            <div class="col-12"><div class="form-floating"><input type="number" class="form-control" id="huespedes" name="huespedes" value="2" placeholder=" " min="1" max="2" required><label for="huespedes">Huéspedes</label></div></div>
            <div class="col-12"><div class="form-floating"><input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre" autocomplete="name" required><label for="nombre">Nombre y apellidos</label></div></div>
            <div class="col-12"><div class="form-floating"><input type="email" class="form-control" id="email" name="email" placeholder="tu@correo.com" autocomplete="email" required><label for="email">Correo electrónico</label></div></div>
            <div class="col-12"><div class="form-floating"><input type="tel" class="form-control" id="telefono" name="telefono" placeholder="+34 *** *** ***" autocomplete="tel" required><label for="telefono">Teléfono</label></div></div>
          </div>

          <div class="total-row">
            <span>Total</span>
            <strong>130 €</strong>
          </div>

          <div class="d-grid gap-2 mb-4">
            <button type="submit" class="btn btn-brand">Confirmar reserva</button>
            <a href="detalle-habitacion.html" class="btn btn-brand-outline">Volver a la habitación</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
